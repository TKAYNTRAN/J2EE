spring.application.name=demo

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/j2ee_db
# Alternative configuration (if not using URI):
# spring.data.mongodb.host=localhost
# spring.data.mongodb.port=27017
# spring.data.mongodb.database=j2ee_db
# spring.data.mongodb.username=your_username
# spring.data.mongodb.password=your_password

# Logging
logging.level.root=INFO
logging.level.org.springframework.data.mongodb=DEBUG

# Dev UX: show template changes without restarting the app.
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
