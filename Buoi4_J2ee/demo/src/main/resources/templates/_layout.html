<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Demo Products - Home page">
    <title>Demo Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
    <div class="container-fluid pe-5">
        <a class="navbar-brand" th:href="@{/products}">Home</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/products/add}">Create Product</a>
        </div>

        <div class="d-flex ms-auto align-items-center gap-3">
            <form class="d-flex" role="search" th:action="@{/home/search}" method="get">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>

            <div class="text-light small">
                <span th:if="${#request.userPrincipal != null}"
                      th:text="|Hello, ${#request.userPrincipal.name}|"></span>
                <a th:if="${#request.userPrincipal == null}"
                   th:href="@{/login}"
                   class="btn btn-outline-light btn-sm">Dang nhap</a>
            </div>
        </div>
    </div>
</nav>

<div th:insert="~{:: content}" class="container body-content"></div>

<div class="card-footer text-center">
    <hr/>
    <p>&copy; 2025 - Phát triển ứng dụng với J2EE</p>
</div>
</body>
</html>
