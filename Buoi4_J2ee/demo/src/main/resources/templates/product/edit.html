<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{_layout}">
<head>
    <meta charset="UTF-8">
    <title>Edit product</title>
</head>
<body>
<div th:fragment="content" class="container body-content">
    <h1>Edit Product</h1>
    <form th:action="@{/products/edit}" th:object="${product}"
          method="post" class="form" enctype="multipart/form-data">

        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label for="name">Name</label>
            <input class="form-control" type="text" th:field="*{name}"
                   placeholder="product Name" id="name">
            <div class="alert alert-warning"
                 th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}"></div>
        </div>

        <div class="form-group">
            <label for="price">Price:</label>
            <input class="form-control" type="number" th:field="*{price}"
                   placeholder="price" id="price">
            <div class="alert alert-warning"
                 th:if="${#fields.hasErrors('price')}"
                 th:errors="*{price}"></div>
        </div>

        <div class="form-group">
            <label for="image">Image:</label>
            <div th:if="${product.image} != null and ${product.image} != ''">
                <p class="mb-2">Current Image:</p>
                <img height="100" width="120"
                     th:src="@{/images/{name}(name=${product.image})}"
                     alt="Product Image" class="mb-3 d-block">
            </div>
            <label>Upload New Image:</label>
            <input class="form-control" type="file" id="image" name="imageProduct"
                   accept="image/png,image/jpeg">
            <small class="form-text text-muted">Leave empty to keep current image</small>
            <div class="alert alert-warning"
                 th:if="${#fields.hasErrors('image')}"
                 th:errors="*{image}"></div>
        </div>

        <div class="form-group">
            <label for="category">Category:</label>
            <select th:field="*{category.id}" class="form-control" id="category">
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}"></option>
            </select>
            <div class="alert alert-warning"
                 th:if="${#fields.hasErrors('category')}"
                 th:errors="*{category}"></div>
        </div>

        <div class="form-group">
            <input type="submit" class="btn btn-success" value="Update Product">
            <a th:href="@{/products}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
